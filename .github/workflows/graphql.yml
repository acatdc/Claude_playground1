name: External Data Relay

on:
  push:
    branches: [main]
    paths: ['_query.json']

jobs:
  relay:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Execute request
        run: |
          URL=$(jq -r '.url' _query.json)
          METHOD=$(jq -r '.method // "POST"' _query.json)
          BODY=$(jq -c '.body // null' _query.json)

          CURL_ARGS=(-s -X "$METHOD" -H "Content-Type: application/json")

          while IFS= read -r header; do
            CURL_ARGS+=(-H "$header")
          done < <(jq -r '.headers // {} | to_entries[] | "\(.key): \(.value)"' _query.json)

          if [ "$BODY" != "null" ]; then
            CURL_ARGS+=(-d "$BODY")
          fi

          curl "${CURL_ARGS[@]}" "$URL" > _result.json
          cat _result.json

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _result.json
          git commit -m "relay result" || echo "no changes"
          git push
